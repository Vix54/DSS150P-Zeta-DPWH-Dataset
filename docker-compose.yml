name: dss150p-zeta
services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["${POSTGRES_PORT}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  airflow:
    image: apache/airflow:2.7.3-python3.11
    container_name: dss150p-zeta-airflow
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    command: >
      bash -c "airflow db init &&
      airflow users create --username ${_AIRFLOW_WWW_USER_USERNAME} --password ${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com &&
      airflow scheduler & airflow webserver -p 8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas pyarrow sqlalchemy psycopg2-binary openpyxl pyyaml
      - PYTHONPATH=/opt/airflow
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config
  pipeline:
    build: {context: ., dockerfile: Dockerfile}
    image: dss150p-zeta-pipeline:dev
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_CONTAINER_HOST}
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      postgres: {condition: service_healthy}
volumes: {pgdata:}